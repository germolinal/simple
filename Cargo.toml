
[package]
name = "simple"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "air",
    "calendar",
    "communication",
    "geometry",
    "heat",
    "light",
    "matrix",
    "model",
    "polynomial",
    "rendering",
    "schedule",
    "test_models",
    "weather",
    "derive",
    "utils",
    "validate",
    "validate/derive",
]


[profile.release]
debug = true
lto = true
codegen-units = 1

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "./katex.html"]

[lib]
name = "simple"
path = "src/lib.rs"

[[bin]]
name = "simple"
path = "bin/simple.rs"


[[bin]]
name = "spict"
path = "bin/spict.rs"

[[bin]]
name = "sfluxmtx"
path = "bin/sfluxmtx.rs"


[[bin]]
name = "sfalsecolor"
path = "bin/sfalsecolor.rs"

[[bin]]
name = "scompare"
path = "bin/scompare.rs"


[workspace.dependencies]
rayon = { version = "1.12" }
serde = { version = "1.0", features = ["derive", "rc"] }
# (`float_roundtrip`: floats read back exactly, e.g., from cached optical data)
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rhai = { version = "1.27" }
json5 = { version = "1.3.6" }
rand = { version = "0.10" }
criterion = { version = "0.8", features = ["html_reports"] }

[dependencies]
rhai = { workspace = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true }
clap = "4.5"

model = { path = "model" }
communication = { path = "communication" }
calendar = { path = "calendar", features = ["chrono", "serde"] }
weather = { path = "weather" }
air = { path = "air" }
light = { path = "light" }
matrix = { path = "matrix" }
heat = { path = "heat" }
rendering = { path = "rendering" }
geometry = { path = "geometry" }
polynomial = { path = "polynomial" }
schedule = { path = "schedule" }
utils = { path = "utils" }

[dev-dependencies]
validate = { path = "validate" }
criterion = { workspace = true }

[[bench]]
name = "simulation"
harness = false


[features]
default = []
simd = ["light/simd"]
parallel = [
    "rayon",
    "heat/parallel",
    "light/parallel",
    #"air_flow/parallel"
]
float = [
    "calendar/float",
    "communication/float",
    "air/float",
    "heat/float",
    "light/float",
    "model/float",
    "weather/float",
    "geometry/float",
    "matrix/float",
    "rendering/float",
]
wasm = ["model/wasm", "utils/wasm", "rhai/wasm-bindgen"]
