[package]
name = "rendering"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
model = { path = "../model" }
matrix = { path = "../matrix" }
geometry = { version = "0.2.0", path = "../geometry" }
weather = { path = "../weather" }
calendar = { path = "../calendar" }
utils = { path = "../utils" }
rand = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ['derive'] }
clap = { version = "4.6", features = ["derive"] }
obj-rs = "0.7"
jpeg-encoder = "0.7"


[dev-dependencies]
criterion = { workspace = true }
validate = { path = "../validate" }

[[bench]]
name = "benchmark"
path = "./benches/benchmark.rs"
harness = false

[features]
default = []
float = ["model/float", "geometry/float", "matrix/float", "weather/float", "calendar/float"]
parallel = ["geometry/parallel", "rayon"]
textures = ["geometry/textures"]
simd = []


[[test]]
name = "render_materials"
path = "tests/render_materials.rs"

[[test]]
name = "test_scenes"
path = "tests/test_scenes.rs"
