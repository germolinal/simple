[package]
name = "simple-wasm"
version = "0.1.0"
authors = ["German Molina <germolinal@gmail.com>"]
edition = "2024"
license = "MIT"
description = "WebAssembly bindings for running SIMPLE simulations"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
simple = { path = ".." }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

# Only when targeting WebAssembly: Rhai's `wasm-bindgen` support refuses to
# compile on any other target (so this crate can still be tested natively)
[target.'cfg(target_arch = "wasm32")'.dependencies]
simple = { path = "..", features = ["wasm"] }

[features]
default = []
float = ["simple/float"]
