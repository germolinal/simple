name: Build and deploy docs

# Publishes https://germolinal.github.io/simple/ (see `make book`) entirely
# from a release tag: landing page, book, IO reference, API docs and
# validation reports all describe that release.
#
# Called by release.yaml after the binaries are uploaded (so the download
# links work), or run by hand from the Actions tab to re-publish a tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g., v0.2.0"
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      # Installs the version in rust-toolchain.toml
      - name: Install Rust toolchain
        run: rustup install

      - uses: Swatinem/rust-cache@v2

      # mdbook-katex 0.9.x is the last series compatible with mdbook 0.4.x
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52,mdbook-katex@0.9.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      - name: Build site
        env:
          SIMPLE_VERSION: ${{ inputs.tag }}
        run: make book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Only one deployment at a time; don't cancel one that is in progress
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
