name: Docs (release)

# Re-writes the full docs (hand-written, IO reference and validation reports)
# from the tagged commit. Fails if the validation reports are stale.
on:
  push:
    tags: ["v*"]

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-deploy.yaml
    with:
      generated_ref: ${{ github.ref_name }}
      check_validation: true
