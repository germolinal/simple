name: Release

# Push a tag like `v0.1.0` (see `make release`) to test, create a GitHub
# Release with binaries attached, and then publish the website and docs from
# the tag. Nothing is published unless the tests pass and the validation
# reports are up to date.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check validation reports
        run: ./docs/check_validation.sh

      # Installs the version in rust-toolchain.toml
      - name: Install Rust toolchain
        run: rustup install

      - uses: Swatinem/rust-cache@v2

      - name: Run tests parallel
        run: |
          cargo test --features parallel --workspace --locked
          cargo test --release --features parallel -p simple --locked -- --ignored

  create_release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --generate-notes

  publish_binaries:
    needs: create_release

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            exe: ""
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            exe: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: ".exe"

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup install
          rustup target add ${{ matrix.target }}

      - name: Compile for target ${{ matrix.target }}
        run: cargo build --release --locked --features parallel --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          name=simple-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          for bin in simple spict sfluxmtx sfalsecolor scompare; do
            cp "target/${{ matrix.target }}/release/$bin${{ matrix.exe }}" "$name/"
          done
          cp README.md LICENSE "$name/"
          if [[ "${{ matrix.runner }}" == "windows-latest" ]]; then
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET"

  docs:
    needs: publish_binaries
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-deploy.yaml
    with:
      tag: ${{ github.ref_name }}
