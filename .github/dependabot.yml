# Weekly PRs that update dependencies; CI tests them like any other PR.
# Minor and patch updates are grouped into one PR per ecosystem. (Security
# fixes are opened right away, regardless of the schedule.)
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs/website
    schedule:
      interval: weekly
    groups:
      website:
        update-types: [minor, patch]
