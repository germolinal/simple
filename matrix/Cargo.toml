[package]
name = "matrix"
version = "0.1.0"
authors = ["German Molina <germolinal@gmail.com>"]
edition = "2024"

[dependencies]
rayon = { workspace = true, optional = true }
serde = { version = "1.0.142", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.83"
criterion = { workspace = true }

[features]
default = []
float = []
parallel = ["rayon"]

[[bench]]
name = "generic_matrix_bench"
harness = false

[[bench]]
name = "prod_n_diag"
harness = false

[[bench]]
name = "hot_kernels"
harness = false
